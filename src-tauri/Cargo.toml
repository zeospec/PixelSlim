[package]
name = "pixelslim"
version = "1.0.0"
description = "Ultra-lightweight image optimizer and format converter"
authors = ["ZeoSpec"]
edition = "2021"

[lib]
name = "pixelslim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
webp = "0.3"
oxipng = { version = "9.1", default-features = false }
dirs = "6.0"
walkdir = "2.5"
rfd = "0.15"
imagequant = "4.3"
png = "0.18"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
